name: navpulse_localizer
description: "NavPulse — SIH 2026 PS-168 Offline GNSS + AI/IMU Real-Time Localization System"
publish_to: 'none'
version: 2.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: 5.0.1
  geolocator: 12.0.0
  web_socket_channel: ^3.0.1
  provider: ^6.1.2
  intl: ^0.19.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    # The trained speed model, exported by scripts/export_ondevice_model.py from real
    # IO-VNBD drives with CAN-bus speed labels. 60 gradient-boosted trees, 43 KB.
    - assets/models/ondevice_model.json
    # Offline basemap for one demo area, fetched by tool/fetch_tiles.py. Optional: with
    # no tiles present the map draws a metre grid instead, so the build never depends on
    # the fetch having been run.
    - assets/tiles/
